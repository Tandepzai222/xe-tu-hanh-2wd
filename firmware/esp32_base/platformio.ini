; ============================================================================
;  PlatformIO project — Xe tự hành 2 bánh vi sai, ESP32 + TB6612FNG + MPU-6065
;  Xem docs/04_firmware-esp32.md để biết hướng dẫn sử dụng
; ============================================================================

[env:esp32dev]
platform = espressif32@6.9.0       ; Arduino-ESP32 core 2.0.17 (IDF 4.4.x)
board     = esp32dev
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600
board_build.f_cpu = 240000000L

; --- Thư viện ---
lib_deps =
    bblanchon/ArduinoJson@^6.21.5

; --- Cờ build ---
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -Wall
    -Wno-unused-variable

; --- Giám sát Serial ---
monitor_filters = esp32_exceptios_decoder, send_on_enter, time
monitor_eol = LF
monitor_echo = yes