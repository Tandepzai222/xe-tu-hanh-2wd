# ============================================================================
#  nav2_params.yaml — cấu hình Nav2 cho robot vi sai nhỏ (V_SAFE = 0.30 m/s)
#
#  Chạy:  ros2 launch xe_tu_hanh nav2.launch.py map:=/home/pi/maps/nha.yaml
#
#  ⚠️⚠️  BA LỖI CHẾT NGƯỜI HAY GẶP NHẤT  ⚠️⚠️
#
#  1. `robot_radius` là BÁN KÍNH, không phải đường kính.
#     Robot 20×18 cm → robot_radius = 0.10 (KHÔNG phải 0.20).
#     Đặt sai gấp đôi → Nav2 tưởng robot to gấp 2 → không tìm được đường
#     trong hành lang hẹp, hoặc tệ hơn là tưởng đã an toàn khi chưa an toàn.
#
#  2. `max_vel_x` phải ≤ V_SAFE_MPS = 0.30 m/s của firmware, KHÔNG phải
#     v_max = 0.4425 m/s. Trên 0.33 m/s thì feedforward bù vùng chết bão hoà
#     và PID mất hết dải điều chỉnh → robot chạy không kiểm soát được.
#
#  3. `min_vel_x` của controller phải = 0.0 nếu robot KHÔNG có số lùi an toàn.
#     Robot vi sai 2 bánh nhỏ rất dễ bị "lắc" khi lùi do caster trượt.
# ============================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0          # ⚠️ khớp với LiDAR thực
    laser_min_range: 0.20
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true             # ⚠️ AMCL phát map->odom. Nếu chạy
                                   #    slam_toolbox thì phải TẮT cái này
                                   #    (hoặc tắt slam_toolbox).
    transform_tolerance: 0.5
    update_min_a: 0.087
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_battery_low_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 15.0      # ⚠️ 15 Hz là đủ và an toàn cho WiFi.
                                    #    Đặt 20–50 Hz qua WiFi UDP sẽ bị
                                    #    trễ gói → robot giật.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10    # 10 cm — hợp với robot nhỏ
      movement_time_allowance: 15.0     # 15 s không nhích 10 cm → thất bại
                                        # ⚠️ Đừng để quá nhỏ, robot sẽ bị
                                        #    coi là "kẹt" khi đang quay chậm.

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10           # 10 cm — thực tế cho odometry bánh xe
      yaw_goal_tolerance: 0.20          # ~11.5°
      # ⚠️ Đừng đặt 0.02 m: robot nhỏ với bánh cao su KHÔNG thể đạt tới
      #    độ chính xác đó → Nav2 sẽ quay mãi không dừng.

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.18          # ⚠️ ≤ 0.30 (V_SAFE) và nên ≤ 0.20
                                        #    khi mới chạy lần đầu
      lookahead_dist: 0.30              # ~2× khoảng cách bánh
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.45
      lookahead_time: 1.5
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.10

      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.60   # ~34°
      max_angular_accel: 2.5              # ⚠️ firmware giới hạn ALPHA_MAX = 6.0
                                          #    rad/s². Đặt nhỏ hơn để Nav2 không
                                          #    yêu cầu thứ firmware không làm được.
      rotate_to_heading_angular_vel: 0.8
      allow_reversing: false              # ⚠️ xem cảnh báo #3 ở đầu file

      goal_dist_offset: 0.0              # ⚠️ KHÁC 0 nếu LiDAR không đặt ở tâm
                                         #    quay. Hiện tại LiDAR đặt gần tâm
                                         #    nên để 0.0.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.10                # ⚠️ BÁN KÍNH = 10 cm, KHÔNG phải 20
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0        # ⚠️ LỚN hơn = giảm giá trị chướng ngại
                                        #    NHANH hơn theo khoảng cách. Robot nhỏ
                                        #    cần 5–10; robot to cần 2–3.
        inflation_radius: 0.22          # ≈ robot_radius + 0.10 an toàn
      always_reset_initial_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.10                # ⚠️ BÁN KÍNH
      resolution: 0.05
      track_unknown_space: true         # giữ ô "chưa biết" là chưa biết
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.22
      always_reset_initial_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""                   # đặt qua tham số launch `map:=`

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0     # robot nhỏ, chậm → 5 Hz là đủ
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8             # ⚠️ ≤ W_MAX = 4.78, và nên chậm
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.5             # ⚠️ ≤ ALPHA_MAX = 6.0 rad/s²

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 1.0]      # ⚠️ max_velocity[0] ≤ V_SAFE = 0.30
    min_velocity: [-0.15, 0.0, -1.0]    # ⚠️ lùi rất hạn chế
    max_accel: [0.5, 0.0, 1.5]          # ⚠️ ≤ ACC_MAX = 1.0 m/s² firmware
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

robot_state_publisher:
  ros__parameters:
    use_sim_time: False
    publish_frequency: 20.0
    robot_description: ""               # đặt qua launch

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

lifecycle_manager:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names: []
